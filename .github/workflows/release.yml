name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify tag, test, audit, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Git tag matches pyproject.toml version
        run: |
          python -c "
          import os, tomllib
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          with open('pyproject.toml', 'rb') as f:
              pkg_ver = tomllib.load(f)['project']['version']
          assert tag == pkg_ver, f'Tag {tag} does not match pyproject.toml version {pkg_ver}'
          print(f'Verified release version: {pkg_ver}')
          "

      - name: Run quality, security, and test checks
        run: |
          ruff format --check .
          ruff check .
          mypy src
          python -m pytest -v
          pip-audit

      - name: Build distribution packages
        run: python -m build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish-github-release:
    name: Publish GitHub Release
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

