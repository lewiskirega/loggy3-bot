name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools and install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Run linter (Ruff)
        run: ruff check .

      - name: Run static type checking (mypy)
        run: mypy src

      - name: Run unit and integration tests with coverage
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -v --cov=opensource_runner --cov-report=xml --cov-report=term --cov-fail-under=60

      - name: Verify CLI entrypoint
        run: |
          opensource-runner version
          opensource-runner list

      - name: Build distribution packages
        run: python -m build

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

