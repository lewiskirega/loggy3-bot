title = "OpenSource Runner Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Allow synthetic test fixtures in unit tests and self-test security checks"
paths = [
  '''^tests/''',
  '''^\.gitleaks\.toml$''',
]
stopwords = [
  "synthetic-key",
  "synthetic-aws",
  "synthetic-password",
  "syntheticpass123",
  "synthetic-token",
]
